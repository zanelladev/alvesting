packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  prisma: true
  protobufjs: false
  unrs-resolver: false
# ponytail: o @nestjs/platform-express importa o rxjs (multer.utils.js) sem declará-lo e pegava o rxjs@6.6.7 do inquirer içado em
# node_modules/.pnpm/node_modules; como par declarado ele recebe o 7.8.2 da api. Sai quando o Nest declarar o rxjs no platform-express.
packageExtensions:
  '@nestjs/platform-express':
    peerDependencies:
      rxjs: ^7.1.0
# ponytail: o @azure/monitor-opentelemetry (1.20.1, e a 1.21.0, a mais nova em 18/11/2026) pede o instrumentation-http ^0.221.0, e a 0.221
# grava a query crua no span de requisição (GHSA-3v2p-hm54-8qcq; corrigido na 0.222.0). Sai quando a distribuição aceitar a 0.222 ou mais.
overrides:
  '@opentelemetry/instrumentation-http': 0.222.0
