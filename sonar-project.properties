# SonarCloud (SonarQube Cloud): análise estática e de segurança do código, com a cobertura do Vitest (docs/QUALIDADE.md, seção 7).
# Quem roda é o job coverage do .github/workflows/ci.yml, depois do `pnpm coverage`, e só quando o repositório tem o segredo SONAR_TOKEN.

# As duas chaves só existem depois que o projeto for criado no SonarCloud (docs/QUALIDADE.md, seção 7): troque pelas que ele mostrar.
# Com o valor de exemplo, a análise falha: o token não tem projeto com essa chave.
sonar.organization=PREENCHER
sonar.projectKey=PREENCHER
sonar.projectName=Alvesting
sonar.sourceEncoding=UTF-8

# O escopo é o mesmo da cobertura (os vitest.config.ts): o código da api, do site e dos contratos.
sonar.sources=apps/api/src,apps/web/src,packages/contracts/src
# Os testes moram ao lado do código. Um arquivo é fonte ou teste, nunca os dois (o scanner recusa a análise), então o padrão
# do teste entra nas duas listas abaixo, como a documentação do SonarCloud pede para fonte e teste na mesma pasta.
sonar.tests=apps/api/src,apps/web/src,packages/contracts/src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx
# Fora da análise, como na cobertura: o cliente do Prisma, gerado pelo `prisma generate` (fora do git, não é código escrito
# aqui), e os próprios testes.
sonar.exclusions=apps/api/src/generated/**,**/*.spec.ts,**/*.spec.tsx

# A cobertura: o lcov.info de cada pacote, com os caminhos a partir da raiz do repositório (apps/api/src/..., apps/web/src/...),
# para um arquivo de um pacote não se confundir com o de mesmo nome em outro.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info,packages/contracts/coverage/lcov.info
